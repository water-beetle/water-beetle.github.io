name: Deploy Orbital Days to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npx tsc --noEmit
      - name: Build static blog
        run: npm run build:pages
      - name: Verify public page and assets
        run: npm run check:pages
      - name: Upload public files
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish blog
        id: deployment
        uses: actions/deploy-pages@v4
